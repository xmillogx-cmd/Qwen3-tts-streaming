[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen3-tts-streaming"
version = "0.1.2"
description = "True streaming Qwen3-TTS with CUDA Graphs acceleration (RTF 2.67, TTFA ~355 ms)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xmillogx-cmd" }]
keywords = ["tts", "speech-synthesis", "streaming", "cuda-graphs", "qwen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "torch>=2.5.1",
    "qwen-tts>=0.1.1,<0.2",
    "transformers>=4.57,<5",
    "accelerate",
    "torchaudio",
    "soundfile",
    "sounddevice",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/xmillogx-cmd/Qwen3-tts-streaming"
Repository = "https://github.com/xmillogx-cmd/Qwen3-tts-streaming"
"Bug Tracker" = "https://github.com/xmillogx-cmd/Qwen3-tts-streaming/issues"
Documentation = "https://github.com/xmillogx-cmd/Qwen3-tts-streaming/tree/master/docs"

[project.scripts]
fast-tts = "fast_tts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fast_tts"]

# sdist must contain only what is needed to build the package — never the
# vendored Apache-2.0 Qwen3-TTS source, internal docs, or dev scripts.
[tool.hatch.build.targets.sdist]
exclude = [
    "QWEN.md",
    "requirements.txt",
    "fast_tts_v14.py",
    "*.bat",
    "bench_sdpa.py",
    "debug_graphs.py",
    "profile_v14.py",
    "run_faster.py",
    "run_native.py",
    "test_v14.py",
    "docs/**",
    "Qwen3-TTS/**",
]
